services:
  n8n:
    image: n8nio/n8n:1.82.3
    container_name: gtm-os-n8n
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5679/
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_CORS_ALLOW_ORIGIN: "http://localhost:8080"
      N8N_CORS_ALLOW_METHODS: "GET,POST,OPTIONS"
      N8N_CORS_ALLOW_HEADERS: "Content-Type,Authorization"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  dashboard:
    image: nginx:1.27-alpine
    container_name: gtm-os-dashboard
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  n8n_data:
